# dsh-agent-whales bundle patch.
#
# 一行宿主条目承载这个双面包：宿主 Loader 激活节点半边（lib/index.js），
# dsh-client-modules 再扫同一条目里的 `dsh.client` 声明来装配浏览器半边（lib/client.js）。
#
# 2026-11-17 迁移（DSH v0.2.1-rc.2「Agent Teams 使用子代理和 Session id」）：
#   · Agent Teams 已由官方 @deepseek-ai/dsh-base / dsh-web-app 直接挂载（agent-team / tool-agent-team /
#     ui-agent-team 三行，包名去掉了 experimental 前缀），成员就是标准 subagent。
#   · 旧补丁会用 @deepseek-ai/dsh-experimental-* 的旧包名和已移除的配置键（maxMembers / maxMessageBytes /
#     disposalTimeoutMs / freshProvider / forkProvider）覆盖官方这三行 → 启动报
#     "agent-team: maxMembers is no longer supported"；还关掉了 subagent 四件套，而团队现在正跑在它们上面。
#   · 所以这里不再插入、也不再关掉任何团队 / subagent 行，只保留需求（2026-10-17「每次对话默认带着团队能力」）：
#     对官方 agent-team 行做 id 覆盖，打开 defaultEnabled（新根会话默认开 Team 模式；用户仍可在会话菜单里关）。
#     maxTasks 照抄官方 dsh-base 的值，避免覆盖时丢掉。

- insert:
    - id: agent-whales
      name: dsh-agent-whales

- id: agent-team
  config:
    maxTasks: 256
    defaultEnabled: true
